name: Build OTA release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build PourBot
        run: pio run -e LVGL-320-480
      - name: Verify embedded release version
        run: python tools/verify_firmware_version.py .pio/build/LVGL-320-480/firmware.bin "$GITHUB_REF_NAME"
      - name: Publish firmware.bin
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          .pio/build/LVGL-320-480/firmware.bin#firmware.bin
          --title "PourBot $GITHUB_REF_NAME"
          --generate-notes
